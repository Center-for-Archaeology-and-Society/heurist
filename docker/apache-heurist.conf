# Apache vhost for the Heurist Docker image.
# DocumentRoot is the HEURIST parent directory (the "switchboard"), matching
# server_management/code_setup/virtual_host_configuration_howto.txt.
<VirtualHost *:8080>
    DocumentRoot /var/www/html/HEURIST/
    ServerName localhost
    AddDefaultCharset utf-8

    # The public reverse proxy exposes this container as /h7-alpha while the
    # code lives at /heurist inside the HEURIST document root. Erase the public
    # prefix so real files/directories in the code folder are found directly.
    # [PT] re-enters the URL->filename mapping, so the per-directory rules
    # below see the correct REQUEST_FILENAME.
    RewriteEngine On
    RewriteRule ^/h7-alpha(?:/(.*))?$ /heurist/$1 [PT,L,QSA]

    <Directory /var/www/html/HEURIST/>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # Requests that do not resolve to an existing file or directory are
        # pretty URLs (e.g. /h7-alpha/<db>/view/<id>, /h7-alpha/<db>/web/...
        # /h7-alpha/api/...). Send them to the root router (root/index.php),
        # which maps them onto the correct Heurist scripts. The entrypoint
        # creates a symlink h7-alpha -> heurist so the router can include the
        # version entry point at /h7-alpha/index.php.
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ /index.php [L,QSA]
    </Directory>

    # Belt and braces: never serve the filestore directly
    <Directory /var/www/html/HEURIST/HEURIST_FILESTORE/>
        Require all denied
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/heurist_error.log
    CustomLog ${APACHE_LOG_DIR}/heurist_access.log combined
</VirtualHost>
